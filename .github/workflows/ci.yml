name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...

  cross:
    name: Build for ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: android, goos: android, goarch: arm64, cgo: "1", packages: ./... }
          - { name: windows without cgo, goos: windows, goarch: amd64, cgo: "0", packages: ./hal/dx12/... ./hal/gles/... }
          - { name: the browser, goos: js, goarch: wasm, cgo: "0", packages: . }
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
          PACKAGES: ${{ matrix.packages }}
        run: |
          if [ "$GOOS" = android ]; then
            export CC="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang"
          fi
          go build $PACKAGES

  ios:
    name: Build for iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # What an app on iOS links: the wgpu package and the backends for the platform.
      - run: |
          SDK=$(xcrun -sdk iphoneos --show-sdk-path)
          export CGO_ENABLED=1 GOOS=ios GOARCH=arm64
          export CC="$(xcrun -sdk iphoneos -f clang) -isysroot $SDK -target arm64-apple-ios15.0"
          go build . ./hal/allbackends

  generated:
    name: Vulkan bindings match the generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: |
          (cd cmd/vk-gen && go run . -spec vk.xml -out ../../hal/vulkan/vk/)
          go run ./cmd/vk-cgo hal/vulkan/vk
          git diff --exit-code

  test-linux:
    name: Test on lavapipe and llvmpipe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install Mesa's CPU drivers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libvulkan1 mesa-vulkan-drivers libegl1 libegl-mesa0 libgl1-mesa-dri
      # These ten fail on every driver: there are no automatic pipeline layouts
      # on Vulkan, and Map doesn't flush a WriteBuffer that wasn't submitted.
      # Both are in ROADMAP.md.
      - name: Tests on Vulkan
        run: go test -race -skip '^(TestBufferMapAsyncStatus|TestBufferMapRoundTrip|TestDeviceCreateRenderPipeline|TestIntegrationQueueReadBuffer|TestMixedResourceLifecycle_TrackedSubmission|TestMRTTwoTargetRenderPass|TestRenderPipelineHasRef|TestRenderPipelineReleaseIdempotent|TestRenderPipeline_ReleaseUsesRefDrop|TestRenderPipelineWithVertexBuffers)$' ./...
      - name: GL tests, surfaceless EGL
        run: go test -race -tags integration ./hal/gles/...

  # DX12 has the same ten as Vulkan, and indexed draws render nothing
  # (TestDrawIndexedRenders). Both are in ROADMAP.md.
  test-windows:
    name: Test on WARP
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -skip '^(TestBufferMapAsyncStatus|TestBufferMapRoundTrip|TestDeviceCreateRenderPipeline|TestIntegrationQueueReadBuffer|TestMixedResourceLifecycle_TrackedSubmission|TestMRTTwoTargetRenderPass|TestRenderPipelineHasRef|TestRenderPipelineReleaseIdempotent|TestRenderPipeline_ReleaseUsesRefDrop|TestRenderPipelineWithVertexBuffers|TestDrawIndexedRenders)$' ./...
        shell: bash

  # Pipelines without a layout work on Metal, so only the three Map tests of
  # the ten fail there. Compute pipelines aren't checked against the device's
  # workgroup limits yet. Both are in ROADMAP.md.
  test-macos:
    name: Test on Metal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -skip '^(TestBufferMapAsyncStatus|TestBufferMapRoundTrip|TestIntegrationQueueReadBuffer|TestCreateComputePipelineWorkgroupSizeTooLarge|TestCreateComputePipelineTotalInvocationsExceeded)$' ./...
